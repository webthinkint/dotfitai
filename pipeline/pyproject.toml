[project]
name = "qa-pipeline"
version = "0.1.0"
description = "dotFIT QA corpus Stage 0 (PII scrub) + Stage 1 (parse & classify) — deterministic, cross-platform (Windows dev / Linux prod)."
requires-python = ">=3.12"
dependencies = [
    "python-docx>=1.1,<2",
    "pdfplumber>=0.11,<1",
    "openai>=1.60,<3",
    "azure-search-documents>=11.5,<12",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_pipeline"]

[project.scripts]
qa-pipeline = "qa_pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
