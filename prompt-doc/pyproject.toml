[project]
name = "prompt-doc"
version = "0.1.0"
description = "Export the assistant's prompt and references to a Google Doc, one tab per file, and import the edits back."
requires-python = ">=3.12"
dependencies = [
    "google-auth>=2.30,<3",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_doc"]

[project.scripts]
prompt-doc = "prompt_doc.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
